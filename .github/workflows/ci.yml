name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version
      - name: Syntax and whitespace
        run: |
          set -eu
          git diff --check
          for script in scripts/*.sh; do bash -n "$script"; done
          python3 -m py_compile listener/bug-listener
          python3 -m compileall -q listener Tests scripts/tests
      - name: Swift host tests
        run: swift test
      - name: Listener and deployment tests
        run: uv run --python 3.12 --with typer --with pytest pytest --import-mode=importlib listener/ Tests/ scripts/tests/ -q
      - name: iOS compilation
        run: |
          xcrun --sdk iphoneos swiftc -typecheck -swift-version 6 -target arm64-apple-ios17.0 \
            -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" Sources/BugKit/*.swift
      - name: watchOS sender compilation
        run: |
          xcrun --sdk watchos swiftc -typecheck -swift-version 6 -target arm64_32-apple-watchos10.0 \
            -sdk "$(xcrun --sdk watchos --show-sdk-path)" Sources/BugKit/*.swift
      - name: Headless CloudKit reader compilation
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          python3 scripts/build-cloudkit-reader.py --unsigned
          DerivedData/CloudKitReader/Build/Products/Debug/BugKitCloudReader.app/Contents/MacOS/BugKitCloudReader --help
